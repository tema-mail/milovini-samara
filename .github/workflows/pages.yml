name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Показная копия: подпапка репозитория и закрыто от индексации (живой сайт клиента – milovinisamara.ru).
      - run: npm run build
        env:
          PUBLIC_BASE: /milovini-samara
          PUBLIC_SITE_URL: https://tema-mail.github.io/milovini-samara
          PUBLIC_NOINDEX: '1'
      # весь личный кабинет – за логином и паролем; без секретов шаг падает и открытая админка не публикуется
      - name: Закрыть админку логином и паролем
        run: node scripts/lock-admin.mjs
        env:
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
